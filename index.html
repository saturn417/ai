<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Studio Webchat</title>
    <style>
      :root{
        --bg:#f6f8fb;
        --card:#fff;
        --text:#111827;
        --accent:#0ea5e9;
      }
      [data-theme="dark"]{
        --bg:#0b1220;
        --card:#0f1724;
        --text:#e6eef8;
        --accent:#38bdf8;
      }
      html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
      body{background:var(--bg);color:var(--text);display:flex;flex-direction:column}
      header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(90deg, rgba(255,255,255,0.03), transparent);box-shadow:0 1px 0 rgba(0,0,0,0.04);}
      .brand{font-weight:600;display:flex;gap:12px;align-items:center}
      .controls{display:flex;gap:8px;align-items:center}
      .container{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
      .frame-card{width:100%;max-width:1080px;height:80vh;background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,0.12);overflow:hidden;position:relative}
      iframe{width:100%;height:100%;border:0;display:block}
      /* 로딩 오버레이 */
      .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.2));backdrop-filter: blur(2px);z-index:10}
      .spinner{width:48px;height:48px;border-radius:50%;border:5px solid rgba(0,0,0,0.08);border-top-color:var(--accent);animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* 반응형 */
      @media (max-width:720px){
        .frame-card{height:calc(100vh - 96px);border-radius:8px}
      }
      /* 버튼 스타일 */
      button{background:transparent;border:0;padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer}
      .btn-primary{background:var(--accent);color:white;padding:8px 12px}
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <!-- 로고 이미지 대신 텍스트. 원하면 이미지로 교체 -->
        <div style="font-size:16px">🤖 Copilot Studio</div>
        <div style="font-size:12px;color:gray">Webchat 임베드</div>
      </div>
      <div class="controls">
        <button id="themeBtn" title="다크/라이트 토글">다크/라이트</button>
        <button id="openBtn" class="btn-primary">새 탭으로 열기</button>
      </div>
    </header>

    <div class="container">
      <div class="frame-card">
        <div id="loader" class="loader">
          <div class="spinner" role="status" aria-label="로딩 중"></div>
        </div>

        <!-- iframe: 보안/권한은 필요에 따라 allow/sandbox 조정 -->
        <iframe
          id="chatFrame"
          src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_Ha-iiO/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
          title="Copilot Studio Webchat"
          allow="microphone; camera; clipboard-read; clipboard-write"
          sandbox="allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>
    </div>

    <script>
      const loader = document.getElementById('loader');
      const iframe = document.getElementById('chatFrame');
      // iframe이 로드되면 로더 제거
      iframe.addEventListener('load', ()=> {
        loader.style.display = 'none';
      });

      // 새 탭으로 여는 버튼
      document.getElementById('openBtn').addEventListener('click', ()=>{
        window.open(iframe.src, '_blank', 'noopener');
      });

      // 테마 토글 (iframe 내부에는 영향 없음)
      const themeBtn = document.getElementById('themeBtn');
      themeBtn.addEventListener('click', ()=>{
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      });

      /* 참고: iframe 내부 스타일을 변경하려면:
         1) iframe과 같은 출처여야 document.getElementById('chatFrame').contentDocument... 접근 가능.
         2) 또는 해당 webchat이 postMessage를 통해 테마를 받으면 window.frames[0].postMessage({type:'theme',theme:'dark'}, targetOrigin)
            — Copilot Studio에서 이 메시지를 받는지 문서를 확인하세요.
      */
    </script>
  </body>
</html>
